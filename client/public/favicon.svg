<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="50%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Golden Shield Rim -->
  <path d="M32 4 L54 12 C54 36 44 52 32 60 C20 52 10 36 10 12 Z" fill="url(#gold)" stroke="#78350F" stroke-width="0.8"/>

  <!-- Inner Deep Royal Violet Shield Base -->
  <path d="M32 7.5 L50.5 14.5 C50.5 34.5 42 48.5 32 55.5 C22 48.5 13.5 34.5 13.5 14.5 Z" fill="url(#shieldBg)"/>

  <!-- Inner Golden Thin Border -->
  <path d="M32 10 L48 16 C48 33 40.5 45.5 32 52 C23.5 45.5 16 33 16 16 Z" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.65"/>

  <!-- Stylized Lotus / Starburst Emblem (Zero Blue, Warm Purple & Gold) -->
  <!-- Center Main Petal / Star -->
  <path d="M32 19 C35 27 38 31 32 39 C26 31 29 27 32 19 Z" fill="url(#magenta)" stroke="url(#gold)" stroke-width="1" filter="url(#glow)"/>
  
  <!-- Left Petal -->
  <path d="M32 35 C23 31 21 26 21 22 C24 25 29 29 32 35 Z" fill="url(#magenta)" stroke="url(#gold)" stroke-width="0.9"/>
  <!-- Right Petal -->
  <path d="M32 35 C41 31 43 26 43 22 C40 25 35 29 32 35 Z" fill="url(#magenta)" stroke="url(#gold)" stroke-width="0.9"/>

  <!-- Lower Left Petal -->
  <path d="M32 35 C23 36 21 42 22 44 C26 42 29 39 32 35 Z" fill="url(#magenta)" stroke="url(#gold)" stroke-width="0.9"/>
  <!-- Lower Right Petal -->
  <path d="M32 35 C41 36 43 42 42 44 C38 42 35 39 32 35 Z" fill="url(#magenta)" stroke="url(#gold)" stroke-width="0.9"/>

  <!-- Center Golden Star Radiance -->
  <polygon points="32,26 33.8,31 38.5,32 33.8,33 32,38 30.2,33 25.5,32 30.2,31" fill="#FEF08A" stroke="url(#gold)" stroke-width="0.5"/>
</svg>